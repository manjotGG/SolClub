{% extends "base.html" %}
{% block title %}SolClub Merchant{% endblock %}
{% block content %}
<section class="panel glass span-2">
  <div class="panel-head">
    <h2>Merchant Dashboard</h2>
    <div class="chip">Live Business Pulse</div>
  </div>
  <div class="grid-2">
    <label>Merchant ID
      <input id="merchantId" type="number" min="1" value="1" />
    </label>
    <label>Auto Refresh
      <select id="autoRefreshMs">
        <option value="0">Off</option>
        <option value="5000">5 sec</option>
        <option value="10000" selected>10 sec</option>
      </select>
    </label>
  </div>
  <div class="actions">
    <button id="loadMerchantData">Load Merchant Data</button>
  </div>
  <div class="kpi-row">
    <div class="kpi glass"><small>Revenue</small><strong id="mdRevenue">0</strong></div>
    <div class="kpi glass"><small>Cashback</small><strong id="mdCashback">0</strong></div>
    <div class="kpi glass"><small>Active Users</small><strong id="mdUsers">0</strong></div>
    <div class="kpi glass"><small>NFT Events</small><strong id="mdNfts">0</strong></div>
  </div>
  <pre id="merchantOutput" class="output">{}</pre>
</section>

<section class="panel glass">
  <h2>Revenue Trend (Line)</h2>
  <canvas id="merchantLineChart" height="140"></canvas>
</section>

<section class="panel glass">
  <h2>Reward Distribution</h2>
  <canvas id="merchantDistributionChart" height="140"></canvas>
</section>
{% endblock %}
