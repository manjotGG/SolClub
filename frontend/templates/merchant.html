{% extends "base.html" %}
{% block title %}SolClub Merchant{% endblock %}
{% block content %}
<section class="panel">
  <h2>Merchant Dashboard</h2>
  <div class="grid-2">
    <label>Merchant ID
      <input id="merchantId" type="number" min="1" value="1" />
    </label>
    <label>Auto Refresh
      <select id="autoRefreshMs">
        <option value="0">Off</option>
        <option value="5000">5 sec</option>
        <option value="10000" selected>10 sec</option>
      </select>
    </label>
  </div>
  <div class="actions">
    <button id="loadMerchantData">Load Merchant Data</button>
  </div>
  <pre id="merchantOutput" class="output">{}</pre>
</section>
<script src="/ui/static/js/merchant.js"></script>
{% endblock %}
