<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SolClub | Access Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
body { font-family: 'Inter', sans-serif; background-color: #0f131e; color: #dfe2f2; }
.font-headline { font-family: 'Space Grotesk', sans-serif; }
.glass-panel { background: rgba(27, 31, 43, 0.72); backdrop-filter: blur(16px); }
</style>
</head>
<body class="bg-[#0f131e] text-[#dfe2f2] min-h-screen overflow-x-hidden">
<div class="fixed inset-0 overflow-hidden pointer-events-none">
  <div class="absolute top-[-10%] right-[-10%] w-[420px] h-[420px] bg-purple-500/10 rounded-full blur-[110px]"></div>
  <div class="absolute bottom-[-10%] left-[-10%] w-[420px] h-[420px] bg-cyan-400/10 rounded-full blur-[110px]"></div>
</div>
<main class="relative z-10 min-h-screen px-6 py-12 flex flex-col items-center justify-center">
  <div class="w-full max-w-4xl">
    <header class="text-center mb-10">
      <h1 class="font-headline text-5xl md:text-6xl font-black tracking-tight text-purple-300">SOLCLUB ACCESS PORTAL</h1>
      <p class="mt-4 text-slate-300">Session verified. Choose your destination based on your role.</p>
      <p class="mt-2 text-xs text-slate-400 uppercase tracking-[0.2em]">No anonymous dashboard access allowed</p>
    </header>
    <section class="glass-panel rounded-3xl border border-white/10 p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <button id="enterClient" class="text-left rounded-2xl border border-cyan-400/20 bg-cyan-500/10 p-6 hover:bg-cyan-500/15 transition-all">
          <div class="text-cyan-300 text-xs uppercase tracking-[0.2em] font-bold">Client Route</div>
          <h2 class="font-headline text-3xl font-bold mt-3">Client Dashboard</h2>
          <p class="text-slate-300 mt-3">Rewards, NFT inventory, transactions, and loyalty progress.</p>
        </button>
        <button id="enterMerchant" class="text-left rounded-2xl border border-purple-300/20 bg-purple-500/10 p-6 hover:bg-purple-500/15 transition-all">
          <div class="text-purple-200 text-xs uppercase tracking-[0.2em] font-bold">Merchant Route</div>
          <h2 class="font-headline text-3xl font-bold mt-3">Merchant Dashboard</h2>
          <p class="text-slate-300 mt-3">Analytics, cashback config, franchises, and NFT distribution.</p>
        </button>
      </div>
      <div class="mt-8 flex flex-col md:flex-row items-center justify-between gap-4">
        <div>
          <p id="sessionRole" class="text-sm text-slate-200">Role: resolving...</p>
          <p id="sessionWallet" class="text-xs text-slate-400">Wallet: resolving...</p>
        </div>
        <button id="logoutBtn" class="px-5 py-2 rounded-lg border border-red-300/20 bg-red-500/10 text-red-200 hover:bg-red-500/20 transition-colors">Logout</button>
      </div>
    </section>
  </div>
</main>
</body>
</html>
