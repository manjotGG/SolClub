{% extends "base.html" %}
{% block title %}SolClub Auth{% endblock %}
{% block content %}
<section class="panel glass span-2">
  <div class="panel-head">
    <h2>Join SolClub</h2>
    <div class="chip">Onboarding Quest</div>
  </div>
  <div class="grid-2">
    <label>Wallet Address
      <input id="wallet" type="text" placeholder="Wallet" />
    </label>
    <label>Role
      <select id="role">
        <option value="client">client</option>
        <option value="merchant">merchant</option>
      </select>
    </label>
  </div>
  <div class="quest-list">
    <div class="quest-item">1. Connect account</div>
    <div class="quest-item">2. Connect wallet</div>
    <div class="quest-item">3. Complete first payment</div>
    <div class="quest-item">4. Unlock first reward</div>
  </div>
  <div class="actions wrap-actions">
    <button id="setClientMode" class="secondary">Set Client Mode</button>
    <button id="setMerchantMode" class="secondary">Set Merchant Mode</button>
    <button id="connectWallet">Connect Wallet</button>
    <button id="autoCreateWallet" class="secondary">Auto Create Managed Wallet</button>
    <button id="googleStart">Start Google OAuth</button>
  </div>
  <pre id="authOutput" class="output">{}</pre>
</section>
{% endblock %}
