{% extends "base.html" %}
{% block title %}SolClub Client{% endblock %}
{% block content %}
<section class="panel">
  <h2>Client Dashboard</h2>
  <div class="grid-2">
    <label>Wallet Address
      <input id="wallet" type="text" placeholder="Wallet" />
    </label>
    <label>Merchant ID
      <input id="merchantId" type="number" min="1" value="1" />
    </label>
  </div>
  <div class="grid-2">
    <label>Amount (SOL)
      <input id="amount" type="number" min="0.001" step="0.001" value="0.1" />
    </label>
    <label>Auto Refresh
      <select id="autoRefreshMs">
        <option value="0">Off</option>
        <option value="5000">5 sec</option>
        <option value="10000" selected>10 sec</option>
      </select>
    </label>
  </div>
  <div class="actions">
    <button id="loadClientData">Load Client Data</button>
  </div>
  <div class="kpi-row">
    <div class="kpi"><small>Tier</small><strong id="tier">-</strong></div>
    <div class="kpi"><small>Transactions</small><strong id="txCount">0</strong></div>
    <div class="kpi"><small>Cashback</small><strong id="cashback">0</strong></div>
    <div class="kpi"><small>NFTs</small><strong id="nftCount">0</strong></div>
  </div>
  <pre id="clientOutput" class="output">{}</pre>
</section>
<script src="/ui/static/js/client.js"></script>
{% endblock %}
