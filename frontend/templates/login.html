<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SolClub | Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>body{font-family:'Inter',sans-serif;background:#0f131e;color:#dfe2f2}.font-headline{font-family:'Space Grotesk',sans-serif}.glass{background:rgba(27,31,43,.78);backdrop-filter:blur(16px)}</style>
</head>
<body class="min-h-screen px-6 py-12">
<main class="max-w-xl mx-auto">
<section class="glass rounded-2xl border border-white/10 p-8">
<h1 class="font-headline text-4xl font-black text-cyan-300">Login</h1>
<p class="mt-2 text-slate-300">Use wallet address, username, or email.</p>
<form id="returningLoginForm" class="mt-6 space-y-3">
<input id="returningIdentifier" type="text" placeholder="Wallet / username / email" class="w-full rounded-lg bg-slate-700 border border-slate-600 px-3 py-2" required/>
<input id="returningPassword" type="password" placeholder="Password" class="w-full rounded-lg bg-slate-700 border border-slate-600 px-3 py-2"/>
<select id="returningRole" class="w-full rounded-lg bg-slate-700 border border-slate-600 px-3 py-2">
<option value="client">Client</option>
<option value="merchant">Merchant</option>
</select>
<button type="submit" class="w-full rounded-lg bg-purple-300 text-purple-900 py-3 font-bold uppercase tracking-wider">Login</button>
</form>
<button id="btnGoogleSignin" type="button" class="mt-4 w-full rounded-lg bg-slate-700/70 text-white py-3 font-bold">Sign in with Google</button>
<p id="returningLoginStatus" class="mt-3 text-sm text-slate-300"></p>
<a href="/auth" class="mt-6 inline-block text-cyan-300">Back to auth</a>
</section>
</main>
</body>
</html>
